<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ripper Evidence Modeler</title>
  <desc id="desc">Editorial title image for the Ripper Evidence Modeler skill — turns project code into resume-ready experience. Warm paper-and-stamp aesthetic.</desc>
  <style>
    .title { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 54px; font-weight: 700; letter-spacing: -0.5px; fill: #3f2d1e; }
    .sub   { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 20px; font-style: italic; fill: #9a6b3f; }
    .mono  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f5ece0; }
      .sub   { fill: #d8a86a; }
      .paper { fill: #2a2118; stroke: #4a3a28; }
      .rule  { stroke: #5a4633; }
      .codebg{ fill: #1a130c; stroke: #4a3a28; }
      .code  { fill: #e8b878; }
      .stamp-ring { stroke: #e8a87c; }
      .stamp-txt  { fill: #e8a87c; }
      .stamp-fill { stroke: #e8a87c; }
    }
  </style>

  <!-- warm cream backdrop with a soft tint block -->
  <rect width="900" height="220" fill="#fbf6ec"/>
  <rect x="0" y="0" width="900" height="220" fill="url(#warmtint)" opacity="0.5"/>
  <rect x="3" y="3" width="894" height="214" fill="none" stroke="#e3d0b0" stroke-width="2" rx="2"/>

  <!-- ===== top: title block (y 0-104) ===== -->
  <text class="title" x="450" y="70" text-anchor="middle">Ripper Evidence Modeler</text>
  <text class="sub"   x="450" y="98" text-anchor="middle">代码 → 简历项目经历</text>

  <!-- thin divider between title and icons -->
  <line x1="300" y1="112" x2="600" y2="112" stroke="#d8c4a0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ===== bottom: icon row (y 120-205), kept clear of all text ===== -->

  <!-- left: tilted resume sheet with bullets -->
  <g transform="translate(150,124) rotate(-6)">
    <rect class="paper" x="0" y="0" width="76" height="100" rx="3" fill="#ffffff" stroke="#d8c4a0" stroke-width="1.5"/>
    <rect x="0" y="0" width="76" height="16" fill="#b87333" rx="3"/>
    <rect x="0" y="13" width="76" height="5" fill="#b87333"/>
    <text class="mono" x="38" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#fbf6ec">CV</text>
    <g class="rule" stroke="#cbb78a" stroke-width="1.8" stroke-linecap="round">
      <line x1="12" y1="32" x2="64" y2="32"/>
      <line x1="12" y1="46" x2="64" y2="46"/>
      <line x1="12" y1="60" x2="52" y2="60"/>
      <line x1="12" y1="78" x2="64" y2="78"/>
    </g>
    <g fill="#b87333">
      <circle cx="9" cy="32" r="2"/>
      <circle cx="9" cy="46" r="2"/>
      <circle cx="9" cy="78" r="2"/>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(258,170)">
    <line x1="0" y1="0" x2="48" y2="0" stroke="#b87333" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 0 L38 -7 M48 0 L38 7" stroke="#b87333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- center: code snippet card -->
  <g transform="translate(330,130) rotate(3)">
    <rect class="codebg" x="0" y="0" width="132" height="84" rx="6" fill="#2d2218" stroke="#4a3a28" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="2.6" fill="#e07a5f"/>
    <circle cx="22" cy="12" r="2.6" fill="#e8b878"/>
    <circle cx="32" cy="12" r="2.6" fill="#81b29a"/>
    <g class="mono code" font-size="10" fill="#e8b878">
      <text x="10" y="32">// project</text>
      <text x="10" y="46" fill="#81b29a">func</text>
      <text x="36" y="46" fill="#e8b878">optimize()</text>
      <text x="10" y="60" fill="#e07a5f">  +42%</text>
      <text x="36" y="60" fill="#cdb78f">latency</text>
      <text x="10" y="74" fill="#81b29a">return</text>
      <text x="50" y="74" fill="#e07a5f">✓</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(486,170)">
    <line x1="0" y1="0" x2="48" y2="0" stroke="#b87333" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 0 L38 -7 M48 0 L38 7" stroke="#b87333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- right: round RESUME-READY stamp -->
  <g transform="translate(580,170) rotate(-10)">
    <circle class="stamp-ring stamp-fill" cx="0" cy="0" r="38" fill="none" stroke="#c1462b" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#c1462b" stroke-width="1.3"/>
    <text class="mono stamp-txt" x="0" y="-7" text-anchor="middle" font-size="11" font-weight="700" fill="#c1462b">RESUME</text>
    <text class="mono stamp-txt" x="0" y="9" text-anchor="middle" font-size="11" font-weight="700" fill="#c1462b">READY</text>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#c1462b" stroke-width="1"/>
  </g>

  <!-- far-right: small accent quill / edit mark -->
  <g transform="translate(700,150)" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 40 L26 14 L34 22 L8 48 Z"/>
    <line x1="20" y1="20" x2="28" y2="28"/>
    <line x1="0" y1="40" x2="-6" y2="52"/>
  </g>

  <defs>
    <linearGradient id="warmtint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f3e2c0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e7c9a0" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
</svg>
